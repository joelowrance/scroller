# Checks every pull request (tests, clippy, web build) and, on a push to main,
# also publishes the browser version to GitHub Pages.
# Branch protection requires the `check` job; `smoke` is advisory for now.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same PR cancels the old run; runs on main all finish.
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust with clippy and the wasm target
        run: |
          rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown
          rustup default stable

      # Caches ~/.cargo and target/ (host and wasm builds). Only main writes the
      # cache, so pull requests always start warm from main's latest build.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Read the wasm-bindgen version from Cargo.lock
        id: wasm-bindgen
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Downloads the prebuilt binary instead of compiling it (saves ~5 minutes).
      - name: Install wasm-bindgen-cli ${{ steps.wasm-bindgen.outputs.version }}
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.wasm-bindgen.outputs.version }}

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build for the web
        run: ./scripts/build-web.sh

      # Handed to the smoke job so it tests exactly this build.
      - name: Upload the web build
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist
          retention-days: 3

      - name: Upload the Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Browser smoke test of the web build from `check`. A separate job so that a
  # problem with headless Chromium never blocks `check` or the deploy; it is
  # not a required check until it has proven reliable.
  smoke:
    name: smoke
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/web/package-lock.json

      - name: Install the test's npm packages
        run: npm ci --prefix tests/web --no-audit --no-fund

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("./tests/web/node_modules/playwright/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright's Chromium
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Installs the system libraries; the browser download is skipped on a cache hit.
      - name: Install Chromium
        run: npx --prefix tests/web playwright install --with-deps chromium

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist

      - name: Smoke test
        run: SMOKE_SKIP_BUILD=1 ./scripts/smoke-web.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-screenshots
          # `latest` is a symlink to the run's folder; skip it to avoid a copy.
          path: |
            target/smoke/
            !target/smoke/latest
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5

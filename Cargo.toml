[package]
name = "scroller"
version = "0.1.0"
edition = "2024"

[features]
# Logs frames per second to the console/terminal once a second.
fps-log = []

[dependencies]
# 2D only: skips the 3D renderer, glTF and UI to keep the web download small.
bevy = { version = "0.20.1", default-features = false, features = ["2d", "audio"] }
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Bevy is slow unoptimized: keep our code quick to compile but optimize dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

# Browser build: optimized for download size.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
strip = "debuginfo"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "7.0.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.107", features = ["Window", "Storage"] }

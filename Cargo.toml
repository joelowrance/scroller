[package]
name = "scroller"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.20.1"

# Bevy is slow unoptimized: keep our code quick to compile but optimize dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[package]
name = "scroller"
version = "0.1.0"
edition = "2024"

[features]
# Logs frames per second to the console/terminal once a second.
fps-log = []

[dependencies]
# 2D only: skips the 3D renderer, glTF and UI to keep the web download small.
# No Bevy audio: sound is synthesized in src/audio and played through rodio
# directly, so the output device opens only after the first input (web autoplay).
bevy = { version = "0.20.1", default-features = false, features = ["2d"] }
# Decodes PNGs that override generated sprites (already a Bevy dependency).
png = "0.18.1"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Bevy is slow unoptimized: keep our code quick to compile but optimize dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

# Browser build: optimized for download size.
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
strip = "debuginfo"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dirs = "7.0.0"
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.107", features = ["Window", "Storage", "Location"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wasm-bindgen"] }

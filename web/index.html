<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scroller</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #game { display: block; width: 100%; height: 100%; outline: none; }
    #loading {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #ffd933; font: 16px monospace; letter-spacing: 2px; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="game" tabindex="0"></canvas>
  <div id="loading">LOADING...</div>
  <script type="module">
    import init from "./scroller.js";
    const canvas = document.getElementById("game");
    canvas.addEventListener("pointerdown", () => canvas.focus());
    init().catch((e) => {
      // winit uses an exception to hand control to the browser's event loop.
      if (!String(e).includes("Using exceptions for control flow")) throw e;
    });
    // Hide the loading text once the game has drawn its first frames.
    const ready = setInterval(() => {
      if (canvas.width > 0 && document.readyState === "complete") {
        document.getElementById("loading").remove();
        clearInterval(ready);
        canvas.focus();
      }
    }, 500);
  </script>
</body>
</html>
